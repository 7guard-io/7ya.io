name: Entity Consistency

# Validation commit: verifies the workflow after removing marketplace-action dependencies.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "index.html"
      - "igor-vepretski/index.html"
      - "data/entity-registry.json"
      - "scripts/entity_consistency.py"
      - ".github/workflows/entity-consistency.yml"
  push:
    branches:
      - main
    paths:
      - "index.html"
      - "igor-vepretski/index.html"
      - "data/entity-registry.json"
      - "scripts/entity_consistency.py"
      - ".github/workflows/entity-consistency.yml"

permissions:
  contents: read

jobs:
  entity-consistency:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact commit without marketplace actions
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD

      - name: Confirm runtime
        shell: bash
        run: |
          set -euo pipefail
          python3 --version
          git rev-parse HEAD
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"

      - name: Compile auditor
        run: python3 -m py_compile scripts/entity_consistency.py

      - name: Audit canonical entity architecture
        run: python3 scripts/entity_consistency.py --check

      - name: Verify generated metadata is committed
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/entity_consistency.py --write
          git diff --exit-code -- index.html igor-vepretski/index.html
