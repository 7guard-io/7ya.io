name: Validate Markdown

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  markdown-hygiene:
    name: Check markdown hygiene
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Confirm markdown workflow is available
        run: echo "MARKDOWN_WORKFLOW_AVAILABLE"
