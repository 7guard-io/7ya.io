name: Deploy 7YA API to Netlify

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - netlify/functions/chat.js
      - scripts/prepare-netlify-api-deploy.mjs
      - scripts/test-netlify-chat.mjs
      - .github/workflows/netlify-api-deploy.yml

permissions:
  contents: read

concurrency:
  group: 7ya-api-production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: production
    env:
      NETLIFY_SITE_ID: 5c8695c8-ebec-4faf-b9ae-dd772947f17d
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Require Netlify deployment credential
        shell: bash
        run: |
          if [[ -z "$NETLIFY_AUTH_TOKEN" ]]; then
            echo "::error::Repository secret NETLIFY_AUTH_TOKEN is not configured."
            exit 1
          fi
      - name: Verify API handler contract
        run: npm run test:netlify
      - name: Prepare minimal production bundle
        run: node scripts/prepare-netlify-api-deploy.mjs
      - name: Deploy exact GitHub revision
        working-directory: .netlify-api-deploy
        shell: bash
        run: |
          npx --yes netlify-cli@17.38.1 deploy \
            --prod \
            --dir public \
            --functions netlify/functions \
            --site "$NETLIFY_SITE_ID" \
            --auth "$NETLIFY_AUTH_TOKEN" \
            --message "GitHub ${GITHUB_SHA}"
      - name: Verify deployed API
        env:
          API_URL: https://7ya-api.netlify.app/api/chat
          ORIGIN: https://7ya.io
          TEST_REGION: github-actions-deploy
          EVIDENCE_DIR: artifacts
        run: node scripts/smoke-test.js
      - name: Upload deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 7ya-api-deployment-evidence
          path: artifacts/*.json
          if-no-files-found: warn
          retention-days: 30
