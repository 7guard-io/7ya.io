name: Publish 7YA Production Site

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "styles/**"
      - "evidence/**"
      - "journey/**"
      - "starton/**"
      - "oracle/**"
      - "business/**"
      - "talk/**"
      - "contact/**"
      - "speaker/**"
      - "igor-vepretski/**"
      - "influence/**"
      - "social/**"
      - "articles/**"
      - "data/**"
      - "assets/**"
      - "images/**"
      - "robots.txt"
      - "sitemap.xml"
      - "CNAME"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate public release
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f CNAME
          test "$(cat CNAME)" = "7ya.io"
          grep -qi "איגור" index.html
          grep -qi "Evidence Ledger" index.html
          grep -qi "Evidence before amplification" index.html
          for route in evidence journey starton oracle business talk contact speaker igor-vepretski; do
            test -f "$route/index.html" || { echo "Missing route: $route"; exit 1; }
          done

      - name: Assemble production artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist
          cp index.html CNAME robots.txt sitemap.xml dist/
          for path in styles evidence journey starton oracle business talk contact speaker igor-vepretski influence social articles data assets images; do
            if [ -e "$path" ]; then cp -R "$path" dist/; fi
          done
          touch dist/.nojekyll
          du -sh dist

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
