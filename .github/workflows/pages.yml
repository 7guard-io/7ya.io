name: Publish 7YA Production Site

# Automatic runs remain quarantined while GitHub blocks runners because of
# the account billing lock tracked in issue #83. Keep this workflow complete
# and deployable through workflow_dispatch once Actions can start runners.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate public release
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f 404.html
          test -f CNAME
          test -f styles/igor-home-20260712.css
          test -f styles/igor-portrait-lock-20260712.css
          test -f assets/igor-home-portrait-20260712.webp
          test -f assets/igor-home-portrait-20260712.jpg
          test -f assets/igor-home-og-20260712.jpg
          test -f favicon.svg
          test -f sw.js
          test -f service-worker.js
          test -f scripts/check-site.mjs
          test -f scripts/check-links.mjs
          test -f scripts/inject-ga4.mjs
          test "$(cat CNAME)" = "7ya.io"
          grep -qi "איגור ופרצקי" index.html
          grep -qi "IGOR VEPRETSKI" index.html
          grep -Eq '<meta name="7ya-build" content="[^"]+">' index.html
          grep -Eq '/styles/igor-home-20260712\.css\?v=[0-9]+' index.html
          grep -Eq '/styles/igor-portrait-lock-20260712\.css\?v=[0-9]+' index.html
          grep -Fq 'איש שטח. מייסד StartOn. בונה 7YA.' index.html
          node scripts/check-site.mjs
          node scripts/check-links.mjs

      - name: Assemble immutable production artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist
          cp index.html 404.html CNAME robots.txt sitemap.xml favicon.svg sw.js service-worker.js dist/
          for path in styles evidence journey starton oracle business talk contact speaker media 7ya igor-vepretski influence social articles pass radar data assets images; do
            if [ -e "$path" ]; then cp -RL "$path" dist/; fi
          done
          touch dist/.nojekyll
          test -f dist/styles/igor-home-20260712.css
          test -f dist/styles/igor-portrait-lock-20260712.css
          test -f dist/assets/igor-home-portrait-20260712.webp
          test -f dist/assets/igor-home-og-20260712.jpg
          test -f dist/pass/index.html
          test -f dist/radar/index.html
          du -sh dist

      - name: Inject and verify GA4 tracking
        shell: bash
        env:
          GA_MEASUREMENT_ID: G-1028S7MMGQ
        run: |
          set -euo pipefail
          node scripts/inject-ga4.mjs dist
          expected="$(find dist -type f -name '*.html' | wc -l | tr -d ' ')"
          configured="$(grep -RIl "googletagmanager.com/gtag/js?id=${GA_MEASUREMENT_ID}" dist --include='*.html' | wc -l | tr -d ' ')"
          test "$expected" = "$configured" || {
            echo "GA4 coverage mismatch: expected=$expected configured=$configured"
            exit 1
          }

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
