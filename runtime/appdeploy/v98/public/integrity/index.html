<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>7YA Integrity Cockpit</title><meta name="7ya-release" content="7ya-media-corpus-20260814-1"><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#080a0d;color:#f5f3ea;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}main{width:min(980px,calc(100% - 28px));margin:auto;padding:50px 0}h1{font-size:clamp(38px,7vw,82px);margin:.15em 0}.k{color:#a3e635;font-weight:900}.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin:28px 0}.summary div,.row{border:1px solid #333a32;padding:16px;background:#10130f}.summary b{display:block;font-size:28px}.ok{color:#a3e635}.bad{color:#fb7185}.grid{display:grid;gap:8px}.row{display:grid;grid-template-columns:1.1fr .6fr 2fr;gap:10px;align-items:center;font-size:13px}.row span:last-child{overflow-wrap:anywhere;color:#aaa}.final{margin-top:24px;padding:22px;border:2px solid currentColor;font-size:24px;font-weight:900}@media(max-width:650px){.row{grid-template-columns:1fr}.row span:last-child{font-size:11px}}</style></head><body><main><div class="k">READ-ONLY · SAME-ORIGIN · NO PRIVATE SOURCES</div><h1>7YA Integrity Cockpit</h1><p>Checks live route identity, crawlability and release consistency without changing production state.</p><section class="summary"><div><span>Critical routes</span><b id="routes">0/8</b></div><div><span>Release surfaces</span><b id="markers">0/4</b></div><div><span>Private URL leaks</span><b id="privacy">checking</b></div></section><section class="grid" id="grid"></section><div class="final" id="final">RUNNING</div></main><script>(()=>{const marker='7ya-media-corpus-20260814-1';const routes=['/igor-vepretski/','/talk/','/social/','/pass/','/evidence/','/starton/','/contact/','/radar/'];const privatePatterns=['drive.google.com','notion.so','mail.google.com'];const grid=document.querySelector('#grid');const add=(name,ok,detail)=>{const row=document.createElement('div');row.className='row';row.innerHTML=`<b>${name}</b><strong class="${ok?'ok':'bad'}">${ok?'PASS':'FAIL'}</strong><span>${detail}</span>`;grid.append(row)};async function text(path){const r=await fetch(path,{cache:'no-store'});return{ok:r.ok,status:r.status,body:await r.text()}};(async()=>{let routePass=0;let markerPass=0;let leak=false;const titles=new Set();for(const path of routes){try{const r=await text(path);const d=new DOMParser().parseFromString(r.body,'text/html');const title=(d.querySelector('title')?.textContent||'').trim();const canonical=d.querySelector('link[rel="canonical"]')?.getAttribute('href')||'';const refresh=!!d.querySelector('meta[http-equiv="refresh" i]');const release=d.querySelector('meta[name="7ya-release"]')?.getAttribute('content')||'';const content=(d.body?.textContent||'').trim();const expected=`https://7ya.io${path}`;const unique=title&&!titles.has(title);titles.add(title);const safe=!privatePatterns.some(p=>r.body.includes(p));leak=leak||!safe;const ok=r.ok&&unique&&canonical===expected&&!refresh&&release===marker&&content.length>80&&safe;if(ok)routePass++;add(path,ok,`HTTP ${r.status} · title ${unique?'unique':'bad'} · canonical ${canonical===expected?'ok':'bad'} · refresh ${refresh?'present':'none'} · marker ${release===marker?'ok':'bad'}`)}catch(e){add(path,false,String(e))}}const surfaces=[['root','/'],['release','/release.json'],['live-health','/api/health'],['static-health','/static-health.json']];for(const [name,path] of surfaces){try{const r=await text(path);const ok=r.ok&&r.body.includes(marker);if(ok)markerPass++;if(privatePatterns.some(p=>r.body.includes(p)))leak=true;add(name,ok,`HTTP ${r.status} · marker ${ok?'ok':'missing'}`)}catch(e){add(name,false,String(e))}}document.querySelector('#routes').textContent=`${routePass}/8`;document.querySelector('#markers').textContent=`${markerPass}/4`;document.querySelector('#privacy').textContent=leak?'LEAK':'0';document.querySelector('#privacy').className=leak?'bad':'ok';const pass=routePass===8&&markerPass===4&&!leak;const final=document.querySelector('#final');final.textContent=pass?'PASS · 8/8 ROUTES · 4/4 MARKERS · 0 PRIVATE LEAKS':'FAIL · REVIEW ROWS';final.className=`final ${pass?'ok':'bad'}`;document.documentElement.dataset.integrity=pass?'pass':'fail'})()})();</script><a href="../?chat=open&lang=he" style="position:fixed;left:16px;bottom:16px;padding:12px 16px;background:#111;color:#fff;text-decoration:none;z-index:20">שיחה עם 7YA</a></body></html>
