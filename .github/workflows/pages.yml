name: Emergency GitHub Pages recovery

# This branch is an isolated, static recovery target. It does not modify
# AppDeploy or the canonical production source.
on:
  workflow_dispatch:
  push:
    branches:
      - recovery/github-pages-20260915

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-emergency-recovery
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout recovery static source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run the legacy release gate
        run: npm run release:gate

      - name: Build immutable static artifact
        run: node scripts/build-static-site.mjs

      - name: Verify artifact integrity and routes
        run: |
          node scripts/check-static-artifact.mjs
          node scripts/verify-static-artifact.mjs

      - name: Verify legacy custom-domain markers
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat CNAME)" = "7ya.io"
          test "$(cat dist/CNAME)" = "7ya.io"
          grep -Fq '<link rel="canonical" href="https://7ya.io/"' dist/index.html
          test -f dist/scripts/history-song-core-20260714.js
          test -f dist/scripts/home-public-universe-20260716.js

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload recovery static artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy recovery snapshot to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
