name: Site Process Health

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-site:
    name: Check 7YA public site routes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Print diagnostic context
        run: |
          pwd
          node --version
          npm --version
          ls -la
          ls -la scripts
          ls -la .github/workflows

      - name: Run site process health check
        run: npm run check-site
