name: 7YA API Smoke

on:
  workflow_dispatch:
    inputs:
      api_url:
        description: API endpoint to validate
        required: false
        default: https://7ya-api.netlify.app/api/chat
      origin:
        description: Browser origin to validate
        required: false
        default: https://7ya.io
  push:
    branches: [main]
    paths:
      - netlify/functions/chat.js
      - netlify.toml
      - scripts/smoke-test.js
      - scripts/smoke-test.sh
      - scripts/test-netlify-chat.mjs
      - .github/workflows/api-smoke.yml
  schedule:
    - cron: "17 5 * * *"

permissions:
  contents: read

concurrency:
  group: 7ya-api-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm run test:netlify

  production-smoke:
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      API_URL: ${{ inputs.api_url || vars.API_URL || 'https://7ya-api.netlify.app/api/chat' }}
      ORIGIN: ${{ inputs.origin || vars.FRONTEND_ORIGIN || 'https://7ya.io' }}
      TEST_REGION: github-actions
      EVIDENCE_DIR: artifacts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Wait for production and run metadata-safe smoke test
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..12}; do
            echo "Attempt $attempt/12 against $API_URL"
            if node scripts/smoke-test.js; then
              exit 0
            fi
            sleep 15
          done
          exit 1
      - name: Independent curl verification
        run: bash scripts/smoke-test.sh
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 7ya-api-smoke-evidence
          path: artifacts/*.json
          if-no-files-found: warn
          retention-days: 30
