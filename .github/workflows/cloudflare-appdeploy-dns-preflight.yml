name: Cloudflare AppDeploy DNS Preflight

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-appdeploy-dns-preflight
  cancel-in-progress: false

jobs:
  plan:
    name: Read-only DNS plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Require least-privilege token
        shell: bash
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN is not configured."
            echo "Create a token limited to zone 7ya.io with Zone:Read and DNS:Edit."
            exit 1
          fi

      - name: Print read-only reconciliation plan
        run: node scripts/cloudflare-appdeploy-dns.mjs

      - name: Confirm no mutation path exists in workflow
        run: |
          echo "This workflow never passes --apply."
          echo "No DNS mutation was requested or performed."
