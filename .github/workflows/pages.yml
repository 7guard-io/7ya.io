name: Publish 7YA Creatorverse

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Rich Media Creatorverse release contract
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat CNAME)" = "7ya.io"
          test -f index.html
          test -f styles/creatorverse-20260714.css
          test -f styles/igor-rich-media-20260714.css
          test -f scripts/creatorverse-20260714.js
          grep -Fq 'creatorverse-rich-media-20260714-1' index.html
          grep -Fq 'ONE PERSON.' index.html
          grep -Fq 'MANY WORLDS.' index.html
          grep -Fq 'לא תמונה אחת. נוכחות אמיתית.' index.html
          grep -Fq 'הקול שלי, לא “בלוג”.' index.html
          grep -Fq 'לא רק תוכן. תהליך ציבורי.' index.html
          grep -Fq 'class="visual-bento"' index.html
          grep -Fq 'class="post-grid"' index.html
          grep -Fq 'class="process-steps"' index.html
          grep -Fq 'class="persona-anchor"' index.html
          grep -Fq 'Evidence Ledger' index.html
          grep -Fq 'AGENT COUNCIL' index.html
          ! grep -Eqi 'http-equiv="refresh"|window\.location|location\.replace|noindex' index.html
          echo 'RICH_MEDIA_CREATORVERSE_RELEASE_CONTRACT: PASS'

      - name: Validate static site before publish
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run check-all

      - name: Assemble immutable static artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist
          rsync -a \
            --exclude .git \
            --exclude .github \
            --exclude .netlify \
            --exclude .vercel \
            --exclude dist \
            --exclude node_modules \
            --exclude artifacts \
            ./ dist/
          touch dist/.nojekyll
          test -f dist/index.html
          test -f dist/styles/creatorverse-20260714.css
          test -f dist/styles/igor-rich-media-20260714.css
          test -f dist/scripts/creatorverse-20260714.js
          grep -Fq 'creatorverse-rich-media-20260714-1' dist/index.html
          grep -Fq 'class="visual-bento"' dist/index.html
          grep -Fq 'class="post-grid"' dist/index.html
          grep -Fq 'class="process-steps"' dist/index.html
          echo 'PAGES_RICH_MEDIA_ARTIFACT: PASS'

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
