name: Validate 7YA Release

# GitHub Actions is currently blocked before runner startup at the account/org level.
# Keep the full validation suite available manually without creating false red
# checks on every push or pull request. Restore automatic triggers only after
# the manual smoke workflow passes; see docs/CI_RUNBOOK.md and issue #83.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: 7ya-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Shared local and CI release gate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Run the exact release gate
        run: npm run release:gate

      - name: Upload deterministic artifact manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 7ya-static-artifact-manifest
          path: dist/artifact-manifest.json
          if-no-files-found: warn
          retention-days: 30
