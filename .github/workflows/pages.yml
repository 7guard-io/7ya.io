name: Publish 7YA Site

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '**/*.html'
      - 'styles/**'
      - 'assets/**'
      - 'data/**'
      - 'scripts/check-site.mjs'
      - 'scripts/check-links.mjs'
      - 'sitemap.xml'
      - 'robots.txt'
      - 'CNAME'
      - '.github/workflows/pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate static site before publish
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat CNAME)" = "7ya.io"
          npm ci
          npm run check-all

      - name: Assemble static site artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist
          rsync -a \
            --exclude .git \
            --exclude .github \
            --exclude .netlify \
            --exclude .vercel \
            --exclude dist \
            --exclude node_modules \
            --exclude artifacts \
            ./ dist/
          touch dist/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
