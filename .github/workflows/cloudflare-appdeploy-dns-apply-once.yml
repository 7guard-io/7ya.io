name: RETIRED — AppDeploy DNS Cutover

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    name: AppDeploy DNS cutover is retired
    runs-on: ubuntu-latest
    steps:
      - name: Refuse legacy cutover
        shell: bash
        run: |
          echo "This legacy AppDeploy DNS cutover was retired on 2026-09-16."
          echo "7guard-io/7ya.io remains the canonical source of truth."
          echo "Do not repoint 7ya.io to AppDeploy from this workflow."
          echo "Use the current production-topology governance document before any future domain migration."
