name: Publish 7YA Production Site

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "styles/**"
      - "scripts/**"
      - "museum/**"
      - "evidence/**"
      - "journey/**"
      - "starton/**"
      - "oracle/**"
      - "business/**"
      - "talk/**"
      - "contact/**"
      - "igor-vepretski/**"
      - "influence/**"
      - "social/**"
      - "articles/**"
      - "data/**"
      - "assets/**"
      - "images/**"
      - "robots.txt"
      - "sitemap.xml"
      - "CNAME"
      - ".github/workflows/pages.yml"
  pull_request:
    branches: [main]
    paths:
      - "index.html"
      - "styles/**"
      - "scripts/**"
      - "museum/**"
      - "evidence/**"
      - "journey/**"
      - "starton/**"
      - "oracle/**"
      - "business/**"
      - "talk/**"
      - "contact/**"
      - "igor-vepretski/**"
      - "influence/**"
      - "social/**"
      - "robots.txt"
      - "sitemap.xml"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate public release
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f museum/index.html
          test -f styles/home.css
          test -f styles/museum.css
          test -f scripts/museum.js
          test "$(cat CNAME)" = "7ya.io"
          grep -qi "The person behind the system" index.html
          grep -qi "Enter Igor's digital museum" index.html
          grep -qi "Evidence before amplification" index.html
          grep -qi "Igor Vepretski Digital Museum" museum/index.html
          for route in museum evidence journey starton oracle business talk contact igor-vepretski social; do
            test -f "$route/index.html" || { echo "Missing route: $route"; exit 1; }
          done
          node scripts/check-site.mjs
          node scripts/check-links.mjs

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble production artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist
          cp index.html CNAME robots.txt sitemap.xml dist/
          for path in styles scripts museum evidence journey starton oracle business talk contact igor-vepretski influence social articles data assets images; do
            if [ -e "$path" ]; then cp -R "$path" dist/; fi
          done
          touch dist/.nojekyll
          du -sh dist

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
