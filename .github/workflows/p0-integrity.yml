name: P0 Public Integrity

on:
  pull_request:
    branches: [main]
    paths:
      - '**/*.html'
      - 'robots.txt'
      - 'sitemap.xml'
      - 'release.json'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/**'
      - 'ops/vercel-recovery/**'
      - 'ops/vercel-canonical-proxy/**'
      - '.github/workflows/p0-integrity.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p0-integrity-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Run complete repository gate
        run: npm run check-all

      - name: Run release provenance unit suite
        working-directory: ops/vercel-recovery
        run: node scripts/test-release.js
