name: 7YA Welcome PR

on:
  pull_request_target:
    types: [opened]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  welcome-pr:
    name: Label, comment, and assign new PRs
    runs-on: ubuntu-latest

    steps:
      - name: Welcome pull request
        uses: actions/github-script@v8
        with:
          script: |
            const issueAuthor = context.payload.sender.login;
            const params = {
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo
            };

            await github.rest.issues.addLabels({
              ...params,
              labels: ['needs-review']
            });

            await github.rest.issues.createComment({
              ...params,
              body: `👋 Thanks for contributing @${issueAuthor}. A 7YA maintainer will review this pull request.`
            });

            await github.rest.issues.addAssignees({
              ...params,
              assignees: ['vepretski']
            }).catch(error => core.warning(`Could not auto-assign PR: ${error.message}`));
