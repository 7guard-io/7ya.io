name: 7YA CI

# GitHub Actions is currently blocked before runner startup at the account/org level.
# Keep the full validation suite available manually without creating false red
# checks on every push or pull request. Restore automatic triggers only after
# the manual smoke workflow passes; see docs/CI_RUNBOOK.md and issue #83.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: 7ya-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Code, evidence, routes, release integrity
    runs-on: ubuntu-latest
    timeout-minutes: 18

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Print diagnostic context
        run: |
          node --version
          npm --version
          pwd
          ls -la

      - name: Install lockfile-pinned dependencies
        run: npm ci --ignore-scripts

      - name: Audit production dependency tree
        run: npm audit --omit=dev --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      - name: Build and verify Evidence Oracle tests
        run: npm test

      - name: Verify release manifest tamper rejection
        run: node --test scripts/release-manifest.test.mjs

      - name: Site process and link health
        run: npm run check-all

      - name: Build immutable API release bundle
        run: node scripts/prepare-netlify-api-deploy.mjs

      - name: Verify release file inventory and SHA-256
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          node scripts/verify-release-manifest.mjs \
            .netlify-api-deploy/public/release-manifest.json \
            .netlify-api-deploy

      - name: Static route verification
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 > /tmp/7ya-static-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          sleep 2
          npm run verify:routes -- http://127.0.0.1:4173

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 7ya-ci-evidence-${{ github.sha }}
          path: |
            /tmp/7ya-static-server.log
            .netlify-api-deploy/public/deployment.json
            .netlify-api-deploy/public/release-manifest.json
          if-no-files-found: warn
          retention-days: 30
