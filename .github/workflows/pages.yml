name: Publish 7YA Redirect

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble redirect artifact
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat CNAME)" = "7ya.io"
          grep -Fq "https://igor-7ya-digital-museum.igor-vepretski.chatgpt.site/" index.html
          grep -Fq "https://igor-7ya-digital-museum.igor-vepretski.chatgpt.site/" 404.html
          rm -rf dist
          mkdir -p dist
          cp index.html 404.html CNAME dist/
          touch dist/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
