name: Deploy 7YA API to Netlify

# Production deployment remains manual while issue #83 is open. This workflow
# must not run automatically until the Actions execution blocker is resolved.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: 7ya-api-production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    environment: production
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Require repository deployment credentials
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in NETLIFY_AUTH_TOKEN NETLIFY_SITE_ID; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Repository secret ${name} is not configured."
              missing=1
            fi
          done
          exit "$missing"

      - name: Install pinned toolchain
        run: npm ci --ignore-scripts

      - name: Verify API handler contract
        run: npm run test:netlify

      - name: Prepare immutable production bundle
        run: node scripts/prepare-netlify-api-deploy.mjs

      - name: Verify local release manifest
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          node scripts/verify-release-manifest.mjs \
            .netlify-api-deploy/public/release-manifest.json \
            .netlify-api-deploy

      - name: Deploy exact GitHub revision and capture provider evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          (
            cd .netlify-api-deploy
            ../node_modules/.bin/netlify deploy \
              --prod \
              --dir public \
              --functions netlify/functions \
              --site "$NETLIFY_SITE_ID" \
              --auth "$NETLIFY_AUTH_TOKEN" \
              --message "GitHub ${GITHUB_SHA}" \
              --json
          ) > artifacts/netlify-deploy.json

          jq -e '
            type == "object" and
            ((.deploy_url // .url // "") | type == "string" and length > 0)
          ' artifacts/netlify-deploy.json >/dev/null
          echo "Provider deployment evidence captured."

      - name: Verify deployed release manifest
        env:
          MANIFEST_URL: https://7ya-api.netlify.app/release-manifest.json
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          local_manifest=".netlify-api-deploy/public/release-manifest.json"
          expected_manifest_sha="$(sha256sum "$local_manifest" | awk '{print $1}')"
          expected_bundle_sha="$(jq -r '.bundle_sha256' "$local_manifest")"

          for attempt in {1..12}; do
            body_file="$(mktemp)"
            http_code="$({
              curl --silent --show-error --location \
                --max-time 15 \
                --output "$body_file" \
                --write-out '%{http_code}' \
                "${MANIFEST_URL}?expected=${GITHUB_SHA}&attempt=${attempt}" || true
            })"

            if [[ "$http_code" == "200" ]]; then
              observed_manifest_sha="$(sha256sum "$body_file" | awk '{print $1}')"
              observed_bundle_sha="$(jq -r '.bundle_sha256 // "unavailable"' "$body_file" 2>/dev/null || echo unavailable)"

              if jq -e --arg sha "$GITHUB_SHA" --arg bundle "$expected_bundle_sha" '
                   .schema == "7ya.release-manifest.v1" and
                   .service == "7ya-api" and
                   .commit == $sha and
                   .bundle_sha256 == $bundle
                 ' "$body_file" >/dev/null 2>&1 && \
                 [[ "$observed_manifest_sha" == "$expected_manifest_sha" ]]; then
                cp "$body_file" artifacts/deployed-release-manifest.json
                jq -n \
                  --arg status "PASS" \
                  --arg expected_commit "$GITHUB_SHA" \
                  --arg manifest_sha256 "$observed_manifest_sha" \
                  --arg bundle_sha256 "$observed_bundle_sha" \
                  --arg verified_at_utc "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
                  '{
                    status: $status,
                    expected_commit: $expected_commit,
                    manifest_sha256: $manifest_sha256,
                    bundle_sha256: $bundle_sha256,
                    manifest_verified: true,
                    verified_at_utc: $verified_at_utc
                  }' > artifacts/release-manifest-verification.json
                rm -f "$body_file"
                echo "Production release manifest matches the local immutable bundle."
                exit 0
              fi

              echo "Attempt ${attempt}/12: manifest mismatch; observed bundle ${observed_bundle_sha}."
            else
              echo "Attempt ${attempt}/12: HTTP ${http_code:-000}."
            fi

            rm -f "$body_file"
            sleep 10
          done

          jq -n \
            --arg status "FAIL" \
            --arg expected_commit "$GITHUB_SHA" \
            --arg expected_manifest_sha256 "$expected_manifest_sha" \
            --arg expected_bundle_sha256 "$expected_bundle_sha" \
            --arg manifest_url "$MANIFEST_URL" \
            --arg verified_at_utc "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            '{
              status: $status,
              reason: "Production release manifest did not match the local bundle",
              expected_commit: $expected_commit,
              expected_manifest_sha256: $expected_manifest_sha256,
              expected_bundle_sha256: $expected_bundle_sha256,
              manifest_url: $manifest_url,
              manifest_verified: false,
              verified_at_utc: $verified_at_utc
            }' > artifacts/release-manifest-verification.json
          exit 1

      - name: Verify deployed revision marker
        env:
          DEPLOYMENT_URL: https://7ya-api.netlify.app/deployment.json
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts

          for attempt in {1..12}; do
            body_file="$(mktemp)"
            http_code="$({
              curl --silent --show-error --location \
                --max-time 15 \
                --output "$body_file" \
                --write-out '%{http_code}' \
                "${DEPLOYMENT_URL}?expected=${GITHUB_SHA}&attempt=${attempt}" || true
            })"

            if [[ "$http_code" == "200" ]] && \
               jq -e --arg sha "$GITHUB_SHA" \
                 '.service == "7ya-api" and .commit == $sha' \
                 "$body_file" >/dev/null 2>&1; then
              jq \
                --arg status "PASS" \
                --arg expected_sha "$GITHUB_SHA" \
                --arg verified_at_utc "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
                '. + {
                  status: $status,
                  expected_sha: $expected_sha,
                  sha_verified: true,
                  verified_at_utc: $verified_at_utc
                }' \
                "$body_file" > artifacts/deployment-sha-verification.json
              rm -f "$body_file"
              echo "Production revision marker matches ${GITHUB_SHA}."
              exit 0
            fi

            observed_sha="$(jq -r '.commit // "unavailable"' "$body_file" 2>/dev/null || echo unavailable)"
            echo "Attempt ${attempt}/12: HTTP ${http_code:-000}, observed SHA ${observed_sha}."
            rm -f "$body_file"
            sleep 10
          done

          jq -n \
            --arg status "FAIL" \
            --arg expected_sha "$GITHUB_SHA" \
            --arg deployment_url "$DEPLOYMENT_URL" \
            --arg verified_at_utc "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            '{
              status: $status,
              reason: "SHA mismatch or deployment marker unavailable",
              expected_sha: $expected_sha,
              deployment_url: $deployment_url,
              sha_verified: false,
              verified_at_utc: $verified_at_utc
            }' > artifacts/deployment-sha-verification.json
          exit 1

      - name: Verify deployed API contract
        env:
          API_URL: https://7ya-api.netlify.app/api/chat
          ORIGIN: https://7ya.io
          TEST_REGION: github-actions-deploy
          EVIDENCE_DIR: artifacts
        run: node scripts/smoke-test.js

      - name: Upload deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 7ya-api-deployment-evidence-${{ github.sha }}
          path: |
            artifacts/*.json
            .netlify-api-deploy/public/deployment.json
            .netlify-api-deploy/public/release-manifest.json
          if-no-files-found: error
          retention-days: 30
