name: Publish 7YA Living OS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout canonical production source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Run governed release audit
        continue-on-error: true
        run: npm run release:gate

      - name: Build and verify the exact public artifact
        run: npm run build:site && npm run check:artifact && npm run verify:artifact

      - name: Verify the custom domain contract
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat CNAME)" = "7ya.io"
          test "$(cat dist/CNAME)" = "7ya.io"
          grep -Fq '<link rel="canonical" href="https://7ya.io/"' dist/index.html
          test -f dist/scripts/history-song-core-20260714.js
          test -f dist/scripts/home-public-universe-20260716.js

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
