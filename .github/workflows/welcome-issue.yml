name: 7YA Welcome Issue

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  welcome-issue:
    name: Label, comment, and assign new issues
    runs-on: ubuntu-latest

    steps:
      - name: Welcome issue
        uses: actions/github-script@v8
        with:
          script: |
            const issueAuthor = context.payload.sender.login;
            const params = {
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo
            };

            await github.rest.issues.addLabels({
              ...params,
              labels: ['needs-review']
            });

            await github.rest.issues.createComment({
              ...params,
              body: `👋 Thanks for opening this issue @${issueAuthor}. A 7YA maintainer will review it.`
            });

            await github.rest.issues.addAssignees({
              ...params,
              assignees: ['vepretski']
            }).catch(error => core.warning(`Could not auto-assign issue: ${error.message}`));
